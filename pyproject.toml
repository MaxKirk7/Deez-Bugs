[project]
name = "deez-bugs"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "max", email = "max_kirk1@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "fastapi[standard]",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
]

[project.scripts]
deez-bugs = "deez_bugs:main"
tiger-check = "deez_bugs.db.check:main"
tiger-load = "deez_bugs.db.load:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
