# Fails the check if a .env file or a database password ends up in the repo.
name: no-secrets
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env files tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '\.env\.example$'; then
            echo "::error::.env files must not be committed (they hold the database password)."
            exit 1
          fi
      - name: No connection strings with passwords
        run: |
          if git grep -nE 'postgres(ql)?://[^:/ ]+:[^@ ]+@' -- . ':!*.env.example' | grep -v YOUR_PASSWORD; then
            echo "::error::A database connection string with a password is in the repo."
            exit 1
          fi
